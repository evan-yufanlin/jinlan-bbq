<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金蘭中秋烤肉</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light dark;
  --bg:#F7EFDD;
  --surface:#FFFDF7;
  --surface-2:#FBF1DE;
  --ink:#2B2013;
  --ink-dim:#6B5D48;
  --line:rgba(43,32,19,0.13);
  --accent:#C1571F;
  --accent-ink:#FFFFFF;
  --gold:#A87418;
  --good:#3F7A45;
  --good-bg:rgba(63,122,69,0.12);
  --shadow:rgba(43,32,19,0.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1B2340;
    --surface:#242C4D;
    --surface-2:#2C3559;
    --ink:#F3ECDD;
    --ink-dim:#B9AF9B;
    --line:rgba(243,236,221,0.14);
    --accent:#F0793C;
    --accent-ink:#1B2340;
    --gold:#F0C15A;
    --good:#7FBE83;
    --good-bg:rgba(127,190,131,0.16);
    --shadow:rgba(0,0,0,0.35);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  padding-inline:16px;
  padding-block:0 32px;
  max-width:640px;
  margin:0 auto;
}
h1,h2,h3{font-family:"Noto Serif TC","Noto Sans TC",serif;text-wrap:balance;margin:0;}
button{font-family:inherit;}
input,textarea{font-family:inherit;font-size:15px;}

.topbar{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--bg);
  padding-block:14px 10px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:10px;
}
.topbar .moon{font-size:26px;line-height:1;}
.topbar .titles{flex:1;min-width:0;}
.topbar h1{font-size:19px;font-weight:700;}
.topbar .sub{font-size:12px;color:var(--ink-dim);margin-top:1px;}
.count-pill{
  background:var(--accent);
  color:var(--accent-ink);
  font-weight:700;
  font-size:13px;
  padding:6px 12px;
  border-radius:999px;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.status-pill{
  font-size:11px;color:var(--ink-dim);display:flex;align-items:center;gap:5px;margin-top:2px;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-dim);}
.status-dot.live{background:var(--good);}

.event-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 18px;
  margin-top:16px;
  display:grid;
  gap:6px;
  box-shadow:0 1px 3px var(--shadow);
}
.event-card .row{display:flex;gap:8px;font-size:14px;}
.event-card .label{color:var(--ink-dim);min-width:44px;flex-shrink:0;}

section{margin-top:28px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px;}
.section-head h2{font-size:17px;}
.section-head .hint{font-size:12px;color:var(--ink-dim);}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  box-shadow:0 1px 3px var(--shadow);
}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12px;color:var(--ink-dim);}
.field input{
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink);
  border-radius:10px;
  padding:9px 11px;
}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px;}

.btn{
  border:none;
  border-radius:10px;
  padding:10px 16px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}
.btn:disabled{opacity:.5;cursor:default;}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--line);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-small{padding:6px 12px;font-size:13px;border-radius:8px;}
.btn-row{margin-top:12px;display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;}
.form-msg{font-size:12.5px;color:var(--ink-dim);}

.roster{margin-top:14px;display:grid;gap:8px;}
.roster-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;background:var(--surface-2);border-radius:10px;font-size:14px;
}
.roster-row.mine{outline:1.5px solid var(--accent);}
.roster-row .name{font-weight:700;flex-shrink:0;}
.roster-row .you-tag{font-size:11px;color:var(--accent);font-weight:700;flex-shrink:0;}
.roster-row .nums{color:var(--ink-dim);font-variant-numeric:tabular-nums;flex-shrink:0;}
.roster-row .note{color:var(--ink-dim);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.totals{
  margin-top:10px;display:flex;gap:14px;font-size:13px;color:var(--ink-dim);
  font-variant-numeric:tabular-nums;flex-wrap:wrap;
}
.totals b{color:var(--ink);font-size:15px;}

.category{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  margin-bottom:10px;
  overflow:hidden;
}
.cat-head{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;background:none;border:none;text-align:left;cursor:pointer;color:var(--ink);
}
.cat-head h3{font-size:15px;}
.cat-progress{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;}
.cat-progress .arrow{transition:transform .15s ease;font-size:12px;display:inline-block;}
.category.open .cat-progress .arrow{transform:rotate(90deg);}
.cat-body{
  border-top:1px solid var(--line);
  padding:6px 16px 14px;
}
.category:not(.open) .cat-body{display:none;}

.item-row{padding:10px 0;border-bottom:1px solid var(--line);}
.item-row:last-of-type{border-bottom:none;}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.item-name{font-size:14px;font-weight:500;}
.claims{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chip{
  background:var(--good-bg);color:var(--good);font-size:12.5px;font-weight:500;
  padding:4px 6px 4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;
}
.chip-x{
  border:none;background:rgba(0,0,0,0.12);color:inherit;width:16px;height:16px;border-radius:50%;
  font-size:11px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;
}
.claim-form{display:none;gap:8px;margin-top:8px;}
.claim-form.open{display:flex;flex-wrap:wrap;}
.claim-form input{
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:8px;padding:7px 10px;font-size:13px;flex:1;min-width:90px;
}

.add-item{display:flex;gap:8px;margin-top:10px;}
.add-item input{
  flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:8px;padding:8px 10px;font-size:13px;
}

.footer-note{
  margin-top:26px;padding:14px 16px;border-radius:14px;
  background:var(--surface-2);border:1px dashed var(--line);
  font-size:12.5px;color:var(--ink-dim);line-height:1.6;
}
.footer-note b{color:var(--ink);}
</style>
</head>
<body>

<div class="topbar">
  <div class="moon">🎑</div>
  <div class="titles">
    <h1>金蘭中秋烤肉</h1>
    <div class="sub">2026/09/25（五）・人約黃昏後</div>
    <div class="status-pill"><span class="status-dot" id="statusDot"></span><span id="statusText">連線中…</span></div>
  </div>
  <div class="count-pill" id="headerCount">0 人參加</div>
</div>

<div class="event-card">
  <div class="row"><span class="label">日期</span><span>2026/09/25（五）中秋連假第一天，人約黃昏後</span></div>
  <div class="row"><span class="label">地點</span><span>樹林金蘭會館</span></div>
  <div class="row"><span class="label">地址</span><span>238 新北市樹林區太平路237號</span></div>
</div>

<section>
  <div class="section-head">
    <h2>回報參加人數</h2>
    <span class="hint" id="headcountHint">填一次就好，之後想改再填一筆新的</span>
  </div>
  <div class="card">
    <div class="form-grid">
      <div class="field full">
        <label for="nameInput">姓名</label>
        <input id="nameInput" type="text" placeholder="例如：小明">
      </div>
      <div class="field">
        <label for="adultsInput">大人人數</label>
        <input id="adultsInput" type="number" min="0" value="1">
      </div>
      <div class="field">
        <label for="kidsInput">小孩人數</label>
        <input id="kidsInput" type="number" min="0" value="0">
      </div>
      <div class="field full">
        <label for="noteInput">備註（選填，例如：晚點到）</label>
        <input id="noteInput" type="text" placeholder="選填">
      </div>
    </div>
    <div class="btn-row">
      <span class="form-msg" id="headcountMsg"></span>
      <button class="btn btn-ghost btn-small" id="cancelHeadcount" hidden>取消我的回報</button>
      <button class="btn btn-primary" id="submitHeadcount">送出回報</button>
    </div>

    <div class="roster" id="rosterList"></div>
    <div class="totals" id="totalsLine"></div>
  </div>
</section>

<section>
  <div class="section-head">
    <h2>物資與工作認領</h2>
    <span class="hint">點項目就能認領，多人認領同一項也沒關係；認領錯了可以按 × 取消</span>
  </div>
  <div id="categoryList"></div>
</section>

<div class="footer-note">
  這頁面會即時同步——你送出回報或認領後，其他人畫面幾秒內就會自動更新，不用重新整理。你自己送出的項目可以編輯或取消，但看不到、也改不動別人的資料。資料存在活動用的 Firebase 資料庫裡，僅供這次活動使用。
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoScKQbsEHoxCLef_nUA9yKVY4etvq0nA",
  authDomain: "jinlan-bbq-2026.firebaseapp.com",
  projectId: "jinlan-bbq-2026",
  storageBucket: "jinlan-bbq-2026.firebasestorage.app",
  messagingSenderId: "385754910611",
  appId: "1:385754910611:web:a0cbc8a472ba1a178e2266"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUid = null;
let didPrefillHeadcount = false;

const CATEGORIES = [
  { key:'staple', name:'主食（肉類／海鮮）', items:['牛肉','羊肉','豬肉','雞肉','魚類','蝦類','貝類／軟體類','內臟類','香腸','丸類','熟食／料理包','鍋物湯底'] },
  { key:'side', name:'副食／蔬菜', items:['豆製品（豆干／豆腐）','米血','甜不辣','葉菜類','菇類','玉米／筊白筍','南瓜／地瓜','高麗菜／美生菜','水果／糕餅','吐司／米腸'] },
  { key:'condiment', name:'調味與其他', items:['烤肉醬／沾醬','鹽／胡椒','蒜頭／薑片','醬油／蠔油','米酒','汽水／果汁／茶飲','啤酒','冰塊'] },
  { key:'equipment', name:'器材類', items:['烤肉網','刀具／剪刀','木炭','打火機／火種','卡式爐','烤盤／鍋具','竹籤／衛生筷','衛生碗盤杯','垃圾袋','濕紙巾／紙巾','冰桶／保冰袋','錫箔紙','免洗手套'] },
  { key:'venue', name:'場地／休閒設備', items:['桌','椅','帳篷／天幕','燈具','風扇','延長線','藍芽喇叭','桌巾'] }
];

let openCat = 'staple';
let roster = [];
let claims = {};     // itemKey -> [{id, name, detail, ownerUid}]
let customItems = {}; // category -> [name]

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function cssAttr(k){ return k.replace(/"/g,'\\"'); }

function itemsFor(cat){
  return cat.items.concat(customItems[cat.key] || []);
}

function myHeadcount(){
  return roster.find(function(r){ return r.ownerUid && r.ownerUid === currentUid; });
}

function renderRoster(){
  var list = document.getElementById('rosterList');
  var totalAdults = 0, totalKids = 0;
  list.innerHTML = roster.map(function(r){
    totalAdults += Number(r.adults)||0;
    totalKids += Number(r.kids)||0;
    var mine = r.ownerUid && r.ownerUid === currentUid;
    return '<div class="roster-row'+(mine?' mine':'')+'">'+
      '<span class="name">'+esc(r.name)+'</span>'+
      (mine ? '<span class="you-tag">（你）</span>' : '')+
      '<span class="nums">大'+ (Number(r.adults)||0) +'・小'+ (Number(r.kids)||0) +'</span>'+
      (r.note ? '<span class="note">'+esc(r.note)+'</span>' : '')+
      '</div>';
  }).join('');

  document.getElementById('totalsLine').innerHTML =
    '目前回報：<b>'+roster.length+'</b> 組・大人 <b>'+totalAdults+'</b> 人・小孩 <b>'+totalKids+'</b> 人';
  document.getElementById('headerCount').textContent = (totalAdults+totalKids)+' 人參加';

  var mine = myHeadcount();
  var submitBtn = document.getElementById('submitHeadcount');
  var cancelBtn = document.getElementById('cancelHeadcount');
  var hint = document.getElementById('headcountHint');
  if(mine){
    submitBtn.textContent = '更新我的回報';
    cancelBtn.hidden = false;
    hint.textContent = '你已經回報過了，改資料後按「更新我的回報」即可';
    if(!didPrefillHeadcount){
      document.getElementById('nameInput').value = mine.name || '';
      document.getElementById('adultsInput').value = mine.adults != null ? mine.adults : 1;
      document.getElementById('kidsInput').value = mine.kids != null ? mine.kids : 0;
      document.getElementById('noteInput').value = mine.note || '';
      didPrefillHeadcount = true;
    }
  } else {
    submitBtn.textContent = '送出回報';
    cancelBtn.hidden = true;
    hint.textContent = '填一次就好，之後想改用同一台裝置回來這頁修改即可';
  }
}

function renderCategories(){
  var wrap = document.getElementById('categoryList');
  wrap.innerHTML = CATEGORIES.map(function(cat){
    var items = itemsFor(cat);
    var claimedCount = items.filter(function(name){
      return (claims[cat.key+'::'+name]||[]).length>0;
    }).length;
    var isOpen = openCat === cat.key;

    var itemsHtml = items.map(function(name){
      var k = cat.key+'::'+name;
      var list = claims[k] || [];
      var chips = list.map(function(c){
        var mine = c.ownerUid && c.ownerUid === currentUid;
        return '<span class="chip">'+esc(c.name)+(c.detail?'：'+esc(c.detail):'')+
          (mine ? ' <button class="chip-x" data-cancel-claim="'+esc(c.id)+'" title="取消認領">×</button>' : '')+
          '</span>';
      }).join('');
      return '<div class="item-row">'+
        '<div class="item-top">'+
          '<span class="item-name">'+esc(name)+'</span>'+
          '<button class="btn btn-ghost btn-small" data-claim-toggle="'+esc(k)+'">＋ 我要認領</button>'+
        '</div>'+
        (chips ? '<div class="claims">'+chips+'</div>' : '')+
        '<div class="claim-form" data-form-for="'+esc(k)+'">'+
          '<input type="text" placeholder="你的名字" data-claim-name="'+esc(k)+'">'+
          '<input type="text" placeholder="內容／數量（選填）" data-claim-detail="'+esc(k)+'">'+
          '<button class="btn btn-primary btn-small" data-claim-submit="'+esc(k)+'">送出</button>'+
        '</div>'+
      '</div>';
    }).join('');

    return '<div class="category'+(isOpen?' open':'')+'" data-cat="'+cat.key+'">'+
      '<button class="cat-head" data-cat-toggle="'+cat.key+'">'+
        '<h3>'+esc(cat.name)+'</h3>'+
        '<span class="cat-progress"><span>'+claimedCount+' / '+items.length+' 已認領</span><span class="arrow">›</span></span>'+
      '</button>'+
      '<div class="cat-body">'+
        itemsHtml+
        '<div class="add-item">'+
          '<input type="text" placeholder="清單沒有你要的項目？自己新增一項" data-add-item="'+cat.key+'">'+
          '<button class="btn btn-ghost btn-small" data-add-submit="'+cat.key+'">新增</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');

  wrap.querySelectorAll('[data-cat-toggle]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var k = btn.getAttribute('data-cat-toggle');
      openCat = (openCat===k) ? null : k;
      renderCategories();
    });
  });
  wrap.querySelectorAll('[data-claim-toggle]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var k = btn.getAttribute('data-claim-toggle');
      var form = wrap.querySelector('[data-form-for="'+cssAttr(k)+'"]');
      form.classList.toggle('open');
    });
  });
  wrap.querySelectorAll('[data-claim-submit]').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(!currentUid){ alert('連線中，請稍等一下再試'); return; }
      var k = btn.getAttribute('data-claim-submit');
      var nameEl = wrap.querySelector('[data-claim-name="'+cssAttr(k)+'"]');
      var detailEl = wrap.querySelector('[data-claim-detail="'+cssAttr(k)+'"]');
      var name = (nameEl.value||'').trim();
      if(!name){ nameEl.focus(); return; }
      btn.disabled = true;
      addDoc(collection(db,'claims'), {
        itemKey: k,
        name: name,
        detail: (detailEl.value||'').trim(),
        ownerUid: currentUid,
        ts: serverTimestamp()
      }).catch(function(err){ alert('送出失敗，請檢查網路後再試一次：'+err.message); })
        .finally(function(){ btn.disabled = false; });
    });
  });
  wrap.querySelectorAll('[data-cancel-claim]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var id = btn.getAttribute('data-cancel-claim');
      if(!confirm('確定要取消這項認領嗎？')) return;
      deleteDoc(doc(db,'claims', id)).catch(function(err){ alert('取消失敗：'+err.message); });
    });
  });
  wrap.querySelectorAll('[data-add-submit]').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(!currentUid){ alert('連線中，請稍等一下再試'); return; }
      var catKey = btn.getAttribute('data-add-submit');
      var input = wrap.querySelector('[data-add-item="'+catKey+'"]');
      var val = (input.value||'').trim();
      if(!val){ input.focus(); return; }
      btn.disabled = true;
      addDoc(collection(db,'customItems'), { category: catKey, name: val, ts: serverTimestamp() })
        .then(function(){ openCat = catKey; input.value=''; })
        .catch(function(err){ alert('新增失敗：'+err.message); })
        .finally(function(){ btn.disabled = false; });
    });
  });
}

document.getElementById('submitHeadcount').addEventListener('click', function(){
  if(!currentUid){ document.getElementById('headcountMsg').textContent = '連線中，請稍等一下再試'; return; }
  var btn = this;
  var name = (document.getElementById('nameInput').value||'').trim();
  if(!name){ document.getElementById('nameInput').focus(); return; }
  var mine = myHeadcount();
  var ref = mine ? doc(db,'headcounts', mine.id) : doc(collection(db,'headcounts'));
  var payload = {
    name: name,
    adults: Number(document.getElementById('adultsInput').value)||0,
    kids: Number(document.getElementById('kidsInput').value)||0,
    note: (document.getElementById('noteInput').value||'').trim(),
    ownerUid: currentUid,
    ts: serverTimestamp()
  };
  btn.disabled = true;
  document.getElementById('headcountMsg').textContent = '送出中…';
  setDoc(ref, payload).then(function(){
    document.getElementById('headcountMsg').textContent = '已送出！';
    setTimeout(function(){ document.getElementById('headcountMsg').textContent=''; }, 2000);
  }).catch(function(err){
    document.getElementById('headcountMsg').textContent = '送出失敗：'+err.message;
  }).finally(function(){ btn.disabled = false; });
});

document.getElementById('cancelHeadcount').addEventListener('click', function(){
  var mine = myHeadcount();
  if(!mine) return;
  if(!confirm('確定要取消你的參加回報嗎？')) return;
  deleteDoc(doc(db,'headcounts', mine.id)).then(function(){
    document.getElementById('nameInput').value='';
    document.getElementById('adultsInput').value='1';
    document.getElementById('kidsInput').value='0';
    document.getElementById('noteInput').value='';
    didPrefillHeadcount = false;
  }).catch(function(err){ alert('取消失敗：'+err.message); });
});

function setStatus(live){
  document.getElementById('statusDot').classList.toggle('live', live);
  document.getElementById('statusText').textContent = live ? '即時同步中' : '連線中…';
}

onAuthStateChanged(auth, function(user){
  currentUid = user ? user.uid : null;
  renderRoster();
  renderCategories();
});
signInAnonymously(auth).catch(function(err){
  document.getElementById('statusText').textContent = '身分驗證失敗，請重新整理頁面';
  console.error(err);
});

onSnapshot(query(collection(db,'headcounts'), orderBy('ts')), function(snap){
  roster = snap.docs.map(function(d){ var r = d.data(); r.id = d.id; return r; });
  renderRoster();
  setStatus(true);
}, function(err){
  setStatus(false);
  document.getElementById('statusText').textContent = '連線失敗，請確認 Firebase 設定';
  console.error(err);
});

onSnapshot(query(collection(db,'claims'), orderBy('ts')), function(snap){
  claims = {};
  snap.docs.forEach(function(d){
    var c = d.data(); c.id = d.id;
    if(!claims[c.itemKey]) claims[c.itemKey] = [];
    claims[c.itemKey].push(c);
  });
  renderCategories();
});

onSnapshot(query(collection(db,'customItems'), orderBy('ts')), function(snap){
  customItems = {};
  snap.docs.forEach(function(d){
    var c = d.data();
    if(!customItems[c.category]) customItems[c.category] = [];
    if(customItems[c.category].indexOf(c.name) === -1) customItems[c.category].push(c.name);
  });
  renderCategories();
});

renderCategories();
</script>
</body>
</html>
